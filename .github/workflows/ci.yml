name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # rebuild the apt repository from the existing releases

permissions:
  contents: write   # needed to attach the .deb to a release

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper perl nodejs git ca-certificates

      - uses: actions/checkout@v4

      - name: Unit tests (PVE modules stubbed)
        run: make test

      - name: GUI syntax check
        run: node --check www/pvesan.js

      - name: Build package
        run: |
          make deb
          mkdir -p dist
          mv ../pve-fcsan_*_all.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pve-fcsan-deb
          path: dist/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb

  # apt repository on GitHub Pages, built from every release's .deb
  apt-repo:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Fetch every released package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/pool/main
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir site/pool/main --skip-existing
          done
          ls -l site/pool/main

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: sh tools/build-apt-repo.sh site "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
