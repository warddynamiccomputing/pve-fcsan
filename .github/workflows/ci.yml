name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to attach the .deb to a release

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper perl nodejs git ca-certificates

      - uses: actions/checkout@v4

      - name: Unit tests (PVE modules stubbed)
        run: make test

      - name: GUI syntax check
        run: node --check www/pvesan.js

      - name: Build package
        run: |
          make deb
          mkdir -p dist
          mv ../pve-fcsan_*_all.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pve-fcsan-deb
          path: dist/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
